[project]
log_level = INFO
output_dir = output
software_version = 1.2.0

# --- 日志落盘配置 ---
# 视觉与主调度日志文件名
log_vision_file = vision.log
# 通信模块日志文件名
log_tcp_file = tcp.log
# 单文件最大字节数 (10MB = 10485760)
log_max_bytes = 10485760
# 循环备份文件数量
log_backup_count = 5
# 是否输出到控制台 (true / false)
log_console_enable = true

[crop]
left_path = 88.jpg
right_path = 99.jpg
width = 0
height = 0

[stitch]
# 空=自动计算；填则用 JSON 数组，如 [960, 0]
points =

[yolo]
model_path = weights/yolov8n.onnx
conf_threshold = 0.25
img_size = 640

[business]
# ROI 框：JSON 对象，值=[x1,y1,x2,y2]
roi_boxes = {"roi_1": [40, 280, 160, 400], "roi_2": [165, 255, 280, 405], "roi_3": [308, 255, 435, 410], "roi_4": [455, 285, 595, 415]}
# 物品构成：键为逗号分隔的类别组合
class_item_map = {"person,surfboard": "滑板人偶", "person": "单人偶"}
roi_bind_map = {"roi_1": "滑板人偶", "roi_2": "滑板人偶", "roi_3": "滑板人偶", "roi_4": "滑板人偶"}
self_check_map = {"roi_1": "person", "roi_2": "person"}
# 合法工具类别集：JSON 数组；空=不判
valid_class_ids = []
low_confidence_threshold = 0.60

[comm]
# 上位机 IP（协议 v1.0：上位机=Server，边缘机=Client）
host = 192.168.100.2
# 192.168.1.100
port = 9000

# --- A1 连接与重连（通信层入参，全部暴露在此）---
# 断线重连退避序列；单位: 秒；JSON 数组；序列走完后停在最后一档循环
reconnect_backoff = [1, 2, 4, 8, 16, 30]
# 建连超时；单位: 秒
connect_timeout = 5.0
# 收包轮询超时；单位: 秒；超时仅表示暂无数据，不视为断线
recv_poll_timeout = 0.5
# 单次 recv 缓冲区大小；单位: 字节
recv_buffer_size = 4096

# --- A3 帧编解码（通信层入参，全部暴露在此）---
# 单帧 payload 上限；单位: 字节；不含末尾 \n；超过即丢弃到下一个 \n
max_frame_bytes = 1048576
# 边缘机作为接收方认识的 type 白名单（JSON 数组）；不在此列一律丢弃
known_types = ["recognize", "version_query"]
# 丢弃日志截取原始片段的前 N 字节，防刷屏；单位: 字节
drop_log_head_bytes = 200

# --- A4 请求配对与去重 ---
# 需要去重拦截的报文类型（JSON 数组）
dedup_types = ["recognize"]
# 已完成请求的缓存保留时长；单位: 秒；用于应对上位机 3 秒超时重发
dedup_cache_ttl = 60.0

# --- A6 断连缓存与补报 ---
# 断连期间的可靠消息本地缓存上限（条），防内存暴涨
offline_cache_max = 100

[heartbeat]
# 周期帧发送间隔；单位: 秒
interval = 3
# 周期帧 type 字段值（协议固定 periodic）
type = periodic
# 8 路摄像头 ID（JSON 数组）
camera_ids = ["CAM1", "CAM2", "CAM3", "CAM4", "CAM5", "CAM6", "CAM7", "CAM8"]
# 8 路摄像头初始状态（JSON 数组；协议枚举: ok / offline / low_light / dirty / comm_error）
camera_status = ["ok", "ok", "ok", "ok", "ok", "ok", "ok", "ok"]
